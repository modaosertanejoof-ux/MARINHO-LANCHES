<style>
#btn-baixar-app{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:9999;
  background:linear-gradient(135deg,#ea580c,#f97316);
  color:white;
  border:none;
  padding:14px 22px;
  border-radius:50px;
  font-weight:900;
  font-size:14px;
  box-shadow:0 8px 24px rgba(234,88,12,0.4);
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  animation:pulse-app 2s infinite;
  transition:transform 0.2s;
}
#btn-baixar-app:hover{transform:scale(1.05);}
#btn-baixar-app:active{transform:scale(0.95);}
@keyframes pulse-app{
  0%,100%{box-shadow:0 8px 24px rgba(234,88,12,0.4);}
  50%{box-shadow:0 12px 32px rgba(234,88,12,0.6);}
}
#btn-baixar-app .icon{font-size:18px;}
@media(max-width:480px){
  #btn-baixar-app{bottom:90px;padding:12px 18px;font-size:13px;}
}
</style>

<button id="btn-baixar-app" aria-label="Baixar aplicativo">
  <span class="icon">📱</span> Baixar App
</button>

<script>
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt=e;
  document.getElementById('btn-baixar-app').style.display='flex';
});

const btnApp = document.getElementById('btn-baixar-app');
btnApp.addEventListener('click', async ()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    const {outcome} = await deferredPrompt.userChoice;
    console.log('Install:', outcome);
    deferredPrompt=null;
    btnApp.style.display='none';
  } else {
    // Fallback: mostra instruções
    if(/iPhone|iPad|iPod/.test(navigator.userAgent)){
      alert('Para instalar no iPhone:\n1. Toque no botão Compartilhar (quadrado com seta)\n2. Toque em "Adicionar à Tela de Início"\n3. Toque em Adicionar');
    } else {
      alert('Para instalar:\n1. No Chrome, clique nos 3 pontinhos no canto superior\n2. Clique em "Instalar app" ou "Adicionar à tela inicial"');
    }
  }
});

// Esconde se já instalado
window.addEventListener('appinstalled', ()=>{
  btnApp.style.display='none';
});
</script>
